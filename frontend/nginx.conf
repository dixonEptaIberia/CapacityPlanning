server {
    listen 80;
    server_name _;

    # Reasonable upload size for Excel imports.
    client_max_body_size 25m;

    # API: forward /api/* to the backend, stripping the /api prefix.
    # The trailing slash on proxy_pass is what removes /api
    # (e.g. /api/plants -> backend /plants), matching the Vite dev proxy.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: serve static files, fall back to index.html for client-side routes.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
